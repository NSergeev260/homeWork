databaseChangeLog:
  - changeSet:
      id: TEST2025-001-init-departments-table
      author: nsergeev
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: name
                  type: VARCHAR(500)
                  constraints:
                    nullable: false